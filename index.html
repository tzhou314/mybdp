<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>键盘皮肤归档</title>
<style>
:root{--bg:#fbf6f9;--card:#fff;--ink:#3a2f38;--sub:#8b7a86;--line:#efe2ea;--pri:#d36f99;--pri-soft:#fbe6ef;--yes:#3f9a6f;--yes-soft:#e2f3e9;--no:#c25a65;--no-soft:#fbe7e8;--r18:#9b4fc4;--r18-soft:#f2e6fa;--edge:#b0731c;--edge-soft:#fbefdc;--na:#b9adb5;--shadow:0 1px 3px rgba(120,60,90,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#19151a;--card:#251f25;--ink:#f1e7ee;--sub:#a8979f;--line:#382f37;--pri:#e891b5;--pri-soft:#42283a;--yes:#7cc9a0;--yes-soft:#1e372b;--no:#ec8b93;--no-soft:#44262a;--r18:#c99be6;--r18-soft:#352441;--edge:#e3b062;--edge-soft:#3d2f1a;--na:#6f6369;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:20px;letter-spacing:.5px}
h1 small{font-size:13px;color:var(--sub);font-weight:400;margin-left:6px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px}
.search{margin-top:10px;width:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.presets{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.filters{display:none;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.filters.open{display:block}
.frow{display:flex;align-items:center;justify-content:space-between;padding:5px 0;gap:8px}
.frow+.frow{border-top:1px dashed var(--line)}
.frow label{font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;color:var(--sub);padding:4px 9px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.sortrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--sub)}
.sortrow select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:16px}
main{padding:12px 16px;max-width:720px;margin:0 auto}
.group-h{font-size:13px;color:var(--sub);margin:14px 2px 6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kname{font-weight:600;font-size:16px;word-break:break-all}
.kname .po{color:var(--pri)}
.kname .no{color:var(--sub);font-weight:400;margin:0 2px}
.edit{border:0;background:transparent;color:var(--sub);font-size:13px;padding:2px 4px;flex:none}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.b{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.b.y{background:var(--yes-soft);color:var(--yes)}
.b.n{background:var(--no-soft);color:var(--no)}
.b.r{background:var(--r18-soft);color:var(--r18)}
.b.e{background:var(--edge-soft);color:var(--edge)}
.b.u{border-color:var(--line);color:var(--na)}
.notes{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--sub)}
.notes li{margin-top:2px}
.notes b{color:var(--ink);font-weight:500}
.empty{text-align:center;color:var(--sub);padding:50px 10px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(200,90,140,.4)}
.fab.roll{right:auto;left:18px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:26px;box-shadow:var(--shadow)}
.rollmeta{font-size:13px;color:var(--sub);margin:-6px 0 10px}
#rollCard .card{margin-bottom:6px;border-color:var(--pri)}
#rollCard .edit{display:none}
#rollCard.spin .kname{opacity:.55}
#rollCard.land .card{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.banner{background:var(--pri-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner .acts{margin-top:8px;display:flex;gap:8px}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(30,15,25,.45)}
.dlg{padding:16px}
.dlg h2{margin:0 0 12px;font-size:17px}
.field{margin-bottom:12px}
.field>label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.inp{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
textarea.inp{resize:vertical;min-height:38px}
.pair{display:flex;gap:8px}
.pair>div{flex:1;min-width:0}
.combo{position:relative;display:flex}
.combo .inp{padding-right:38px}
.combo .tog{position:absolute;right:2px;top:2px;bottom:2px;width:34px;border:0;background:transparent;color:var(--sub);font-size:14px}
.pomenu{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow-y:auto;box-shadow:0 6px 18px rgba(60,20,40,.15);padding:4px 0;margin:0;list-style:none}
.pomenu.open{display:block}
.pomenu li{padding:9px 12px;font-size:15px;cursor:pointer}
.pomenu li:active,.pomenu li.hl{background:var(--pri-soft)}
.pomenu li .n{color:var(--sub);font-size:12px;margin-left:6px}
.pomenu .none{color:var(--sub);font-size:13px;cursor:default}
.dim{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.dim-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dim-h span{font-size:14px;font-weight:600}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:14px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.del{color:var(--no);margin-right:auto}
.menu .btn{width:100%;text-align:left;margin-bottom:8px}
.menu p{font-size:13px;color:var(--sub);margin:4px 0 12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:.92}
</style>
</head>
<body>
<header>
  <div class="toprow">
    <h1>键盘皮肤归档<small id="count"></small></h1>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="fBtn">筛选</button>
      <button class="iconbtn" id="mBtn">数据</button>
    </div>
  </div>
  <input class="search" id="q" type="search" placeholder="搜 po / 键盘名 / 备注">
  <div class="presets" id="presets"></div>
  <div class="filters" id="filters"></div>
</header>
<main>
  <div id="bannerBox"></div>
  <div class="sortrow"><span id="shown"></span>
    <select id="sort">
      <option value="upd">最近更新</option>
      <option value="po">按 po 分组</option>
      <option value="name">按键盘名</option>
      <option value="new">最早添加</option>
    </select>
  </div>
  <div id="list"></div>
</main>
<button class="fab" id="addBtn" aria-label="添加">＋</button>
<button class="fab roll" id="rollBtn" aria-label="随机一款">🎲</button>

<dialog id="rollDlg"><div class="dlg">
  <h2>今天用这款</h2>
  <p class="rollmeta" id="rollMeta"></p>
  <div id="rollCard"></div>
  <div class="btns">
    <button class="btn" id="rollEdit">编辑</button>
    <button class="btn" id="rollClose">就它了</button>
    <button class="btn pri" id="rollAgain">再 roll 一次</button>
  </div>
</div></dialog>

<dialog id="editDlg"><form class="dlg" id="editForm" method="dialog">
  <h2 id="editTitle" tabindex="-1" autofocus style="outline:none">添加键盘</h2>
  <div class="pair">
    <div class="field"><label>po</label><div class="combo"><input class="inp" name="po" id="poInp" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="tog" id="poTog" aria-label="选择已有 po">▾</button><ul class="pomenu" id="poMenu"></ul></div></div>
    <div class="field"><label>键盘名</label><input class="inp" name="name" autocomplete="off"></div>
  </div>
  <div id="dimFields"></div>
  <div class="field"><label>其他备注</label><textarea class="inp" name="other" rows="2" placeholder="不典型的问题都写这里"></textarea></div>
  <div class="btns">
    <button type="button" class="btn del" id="delBtn">删除</button>
    <button type="button" class="btn" id="cancelBtn">取消</button>
    <button type="submit" class="btn pri">保存</button>
  </div>
</form></dialog>

<dialog id="menuDlg"><div class="dlg menu">
  <h2>数据</h2>
  <p>记录自动存在这台设备的浏览器里。换设备或清缓存前记得导出。</p>
  <button class="btn" id="exHtml">导出带数据的网页（传 GitHub 用）</button>
  <button class="btn" id="exJson">导出备份文件（.json）</button>
  <button class="btn" id="imJson">导入备份文件（合并）</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <div class="btns"><button class="btn" id="closeMenu">关闭</button></div>
</div></dialog>

<div class="toast" id="toast"></div>

<script id="seed" type="application/json">{"exportedAt":0,"items":[]}</script>
<script>
const TEMPLATE = '<!doctype html>\n' + document.documentElement.outerHTML;
const KEY = 'kbArchive.v1';
const DIMS = [
  {k:'look',  label:'素材图好看', yes:'好看',   no:'一般',     cls:'y'},
  {k:'r18',   label:'尺度', opts:[['r18','R18','r'],['edge','擦边','e'],['clean','健全','y']]},
  {k:'sound', label:'音效好听',   yes:'音效好', no:'音效一般', cls:'y'},
  {k:'bigkey',label:'大按键',     yes:'大按键', no:'非大按键', cls:'y'},
  {k:'dark',  label:'暗黑模式用心', yes:'暗黑好看', no:'暗黑敷衍', cls:'y'},
];
const GROUPS = {work:['clean','edge'], off:['r18','edge']};
const GROUP_DESC = {work:'健全＋擦边', off:'R18＋擦边'};
const PRESETS = [
  {id:'work',  label:'上班能用', f:{r18:'work'}},
  {id:'off',   label:'下班用',   f:{r18:'off'}},
  {id:'night', label:'夜里好用', f:{dark:'yes'}},
  {id:'big',   label:'大按键',   f:{bigkey:'yes'}},
  {id:'todo',  label:'还没填完', f:{_todo:true}},
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let store = {items:[], seenSeed:0};
let filt = {}; DIMS.forEach(d => filt[d.k] = 'all');
let todoOnly = false;
let editingId = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ toast('存储失败，记得导出备份'); } }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }

function blankDims(){ const o={}; DIMS.forEach(d=>o[d.k]={v:null,note:''}); return o; }
function norm(it){
  it.dims = Object.assign(blankDims(), it.dims||{});
  const r = it.dims.r18; if(typeof r.v==='boolean') it.dims.r18 = {...r, v: r.v ? 'r18' : 'clean'};
  return it;
}
const segOpts = d => d.opts ? d.opts.map(([v,t])=>[v,t]) : [['yes','是'],['no','否']];
const valKey = (d,v) => v===null||v===undefined ? 'none' : d.opts ? v : (v ? 'yes' : 'no');
const keyVal = (d,k) => k==='none' ? null : d.opts ? k : k==='yes';
const optLabel = (d,k) => d.opts ? (d.opts.find(o=>o[0]===k)||[,k])[1] : (k==='yes' ? '是' : '否');

function mergeItems(incoming){
  const map = new Map(store.items.map(i=>[i.id,i]));
  let added=0, updated=0;
  incoming.forEach(raw=>{
    const it = norm({...raw}); const cur = map.get(it.id);
    if(!cur){ map.set(it.id,it); added++; }
    else if((it.updatedAt||0) > (cur.updatedAt||0)){ map.set(it.id,it); updated++; }
  });
  store.items = [...map.values()]; save(); render();
  return {added, updated};
}

/* ---------- init ---------- */
(function init(){
  let seed = {exportedAt:0, items:[]};
  try{ seed = JSON.parse($('#seed').textContent); }catch(e){}
  const local = load();
  if(!local){
    store = {items:(seed.items||[]).map(norm), seenSeed:seed.exportedAt||0};
    save();
  }else{
    store = {items:(local.items||[]).map(norm), seenSeed:local.seenSeed||0};
    if(seed.exportedAt && seed.exportedAt > store.seenSeed && seed.items && seed.items.length){
      const d = new Date(seed.exportedAt).toLocaleString('zh-CN',{hour12:false});
      $('#bannerBox').innerHTML = `<div class="banner">这个网页里打包了 ${seed.items.length} 条记录（导出于 ${d}），和本机的不一样。要合并进来吗？同一条以较新的为准。
        <div class="acts"><button class="btn pri" id="bMerge">合并</button><button class="btn" id="bIgnore">忽略</button></div></div>`;
      const done = ()=>{ store.seenSeed = seed.exportedAt; save(); $('#bannerBox').innerHTML=''; };
      $('#bMerge').onclick = ()=>{ const r=mergeItems(seed.items); done(); toast(`新增 ${r.added}，更新 ${r.updated}`); };
      $('#bIgnore').onclick = done;
    }
  }
  buildFilters(); buildDimFields(); render();
})();

/* ---------- filters ---------- */
function buildFilters(){
  $('#presets').innerHTML = PRESETS.map(p=>`<button class="chip" data-p="${p.id}">${p.label}</button>`).join('');
  $('#presets').onclick = e=>{
    const b = e.target.closest('[data-p]'); if(!b) return;
    const p = PRESETS.find(x=>x.id===b.dataset.p);
    const wasOn = b.classList.contains('on');
    DIMS.forEach(d=>filt[d.k]='all'); todoOnly=false;
    if(!wasOn){ if(p.f._todo) todoOnly=true; else Object.assign(filt,p.f); }
    syncFilterUI(); render();
  };
  $('#filters').innerHTML = DIMS.map(d=>`<div class="frow"><label>${d.label}</label>
    <div class="seg" data-k="${d.k}">${[['all','全部'],...segOpts(d),['none','未填']].map(([v,t])=>`<button data-v="${v}">${t}</button>`).join('')}</div></div>`).join('')
    + `<div class="frow"><span></span><button class="chip" id="clearF">清除筛选</button></div>`;
  $('#filters').onclick = e=>{
    if(e.target.id==='clearF'){ DIMS.forEach(d=>filt[d.k]='all'); todoOnly=false; syncFilterUI(); render(); return; }
    const b = e.target.closest('.seg button'); if(!b) return;
    filt[b.parentNode.dataset.k] = b.dataset.v; todoOnly=false; syncFilterUI(); render();
  };
  syncFilterUI();
}
function syncFilterUI(){
  document.querySelectorAll('#filters .seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===filt[s.dataset.k])));
  document.querySelectorAll('#presets .chip').forEach(c=>{
    const p = PRESETS.find(x=>x.id===c.dataset.p);
    let on;
    if(p.f._todo) on = todoOnly;
    else on = !todoOnly && DIMS.every(d=> (p.f[d.k]||'all') === filt[d.k]);
    c.classList.toggle('on', on);
  });
  const active = todoOnly || DIMS.some(d=>filt[d.k]!=='all');
  $('#fBtn').textContent = active ? '筛选 ●' : '筛选';
}
$('#fBtn').onclick = ()=> $('#filters').classList.toggle('open');
$('#q').oninput = render;
$('#sort').onchange = render;

/* ---------- render ---------- */
function match(it){
  const q = $('#q').value.trim().toLowerCase();
  if(q){
    const hay = [it.po,it.name,it.other,...DIMS.map(d=>it.dims[d.k].note)].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(todoOnly && DIMS.every(d=>it.dims[d.k].v!==null)) return false;
  for(const d of DIMS){
    const f = filt[d.k]; if(f==='all') continue;
    const k = valKey(d, it.dims[d.k].v);
    if(GROUPS[f] ? !GROUPS[f].includes(k) : k!==f) return false;
  }
  return true;
}
function cardHTML(it){
  const badges = DIMS.map(d=>{
    const v = it.dims[d.k].v;
    if(v===null) return `<span class="b u">${d.label}？</span>`;
    if(d.opts){ const o = d.opts.find(x=>x[0]===v) || [v,v,'u']; return `<span class="b ${o[2]}">${o[1]}</span>`; }
    return `<span class="b ${v?'y':'n'}">${v?d.yes:d.no}</span>`;
  }).join('');
  const notes = DIMS.filter(d=>it.dims[d.k].note).map(d=>`<li><b>${d.label}：</b>${esc(it.dims[d.k].note)}</li>`);
  if(it.other) notes.push(`<li><b>其他：</b>${esc(it.other)}</li>`);
  return `<div class="card"><div class="card-h"><div class="kname">${it.po?`<span class="po">${esc(it.po)}</span><span class="no">の</span>`:''}${esc(it.name)||'<span style="color:var(--sub)">（未命名）</span>'}</div>
    <button class="edit" data-id="${it.id}">编辑</button></div>
    <div class="badges">${badges}</div>${notes.length?`<ul class="notes">${notes.join('')}</ul>`:''}</div>`;
}
function render(){
  const all = store.items;
  const list = all.filter(match);
  const s = $('#sort').value;
  const cmp = (a,b)=>(a||'').localeCompare(b||'','zh-Hans-CN');
  if(s==='upd') list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(s==='new') list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  if(s==='name') list.sort((a,b)=>cmp(a.name,b.name));
  if(s==='po') list.sort((a,b)=>cmp(a.po,b.po)||cmp(a.name,b.name));
  $('#count').textContent = `${all.length} 款`;
  $('#shown').textContent = list.length===all.length ? `共 ${all.length} 条` : `筛出 ${list.length} / ${all.length}`;
  if(!all.length){ $('#list').innerHTML = `<div class="empty">还没有记录，点右下角 ＋ 添加第一款</div>`; return; }
  if(!list.length){ $('#list').innerHTML = `<div class="empty">没有符合条件的键盘</div>`; return; }
  if(s==='po'){
    let html='', last=null;
    list.forEach(it=>{ const p=it.po||'（无 po）'; if(p!==last){ const n=list.filter(x=>(x.po||'（无 po）')===p).length; html+=`<div class="group-h">${esc(p)} · ${n}</div>`; last=p; } html+=cardHTML(it); });
    $('#list').innerHTML = html;
  }else $('#list').innerHTML = list.map(cardHTML).join('');
}
$('#list').onclick = e=>{ const b=e.target.closest('.edit'); if(b) openEdit(b.dataset.id); };

/* ---------- edit ---------- */
function buildDimFields(){
  $('#dimFields').innerHTML = DIMS.map(d=>`<div class="dim"><div class="dim-h"><span>${d.label}</span>
    <div class="seg" data-k="${d.k}">${[...segOpts(d),['none','未填']].map(([v,t])=>`<button type="button" data-v="${v}">${t}</button>`).join('')}</div></div>
    <textarea class="inp" rows="1" name="note_${d.k}" placeholder="备注（可空）"></textarea></div>`).join('');
  $('#dimFields').onclick = e=>{
    const b = e.target.closest('.seg button'); if(!b) return;
    b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
  };
}
function setSeg(k,v){
  const val = valKey(DIMS.find(d=>d.k===k), v);
  document.querySelectorAll(`#dimFields .seg[data-k="${k}"] button`).forEach(b=>b.classList.toggle('on', b.dataset.v===val));
}
function getSeg(k){
  const b = document.querySelector(`#dimFields .seg[data-k="${k}"] button.on`);
  return b ? keyVal(DIMS.find(d=>d.k===k), b.dataset.v) : null;
}
function openEdit(id){
  editingId = id || null;
  const it = id ? store.items.find(x=>x.id===id) : norm({po:'',name:'',other:''});
  const f = $('#editForm');
  f.po.value = it.po||''; f.name.value = it.name||''; f.other.value = it.other||'';
  DIMS.forEach(d=>{ setSeg(d.k, it.dims[d.k].v); f['note_'+d.k].value = it.dims[d.k].note||''; });
  $('#editTitle').textContent = id ? '编辑键盘' : '添加键盘';
  $('#delBtn').style.display = id ? '' : 'none';
  closePoMenu();
  $('#editDlg').showModal();
}
$('#addBtn').onclick = ()=>openEdit();
$('#cancelBtn').onclick = ()=>$('#editDlg').close();
$('#editForm').onsubmit = e=>{
  e.preventDefault();
  const f = e.target, now = Date.now();
  const po = f.po.value.trim(), name = f.name.value.trim();
  if(!po && !name){ toast('po 和键盘名至少填一个'); return; }
  const dims = {}; DIMS.forEach(d=>dims[d.k]={v:getSeg(d.k), note:f['note_'+d.k].value.trim()});
  if(editingId){
    const it = store.items.find(x=>x.id===editingId);
    Object.assign(it,{po,name,other:f.other.value.trim(),dims,updatedAt:now});
  }else{
    const dup = store.items.find(x=>x.po===po && x.name===name);
    if(dup && !confirm(`「${po}の${name}」已经记过了，还要再加一条吗？`)) return;
    store.items.push({id:uid(),po,name,other:f.other.value.trim(),dims,createdAt:now,updatedAt:now});
  }
  save(); render(); $('#editDlg').close(); toast('已保存');
};
$('#delBtn').onclick = ()=>{
  const it = store.items.find(x=>x.id===editingId);
  if(!confirm(`删除「${it.po?it.po+'の':''}${it.name}」？`)) return;
  store.items = store.items.filter(x=>x.id!==editingId); save(); render(); $('#editDlg').close(); toast('已删除');
};

/* ---------- po combo ---------- */
function poCounts(){
  const m = new Map(); store.items.forEach(x=>{ if(x.po) m.set(x.po,(m.get(x.po)||0)+1); });
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hans-CN'));
}
function openPoMenu(showAll){
  const q = showAll ? '' : $('#poInp').value.trim().toLowerCase();
  const all = poCounts();
  const list = q ? all.filter(([p])=>p.toLowerCase().includes(q)) : all;
  const menu = $('#poMenu');
  if(!all.length){ menu.innerHTML = '<li class="none">还没有填过的 po，直接手动输入</li>'; }
  else if(!list.length){ closePoMenu(); return; }
  else if(q && list.length===1 && list[0][0].toLowerCase()===q){ closePoMenu(); return; }
  else menu.innerHTML = list.map(([p,n])=>`<li data-po="${esc(p)}">${esc(p)}<span class="n">${n} 款</span></li>`).join('');
  menu.classList.add('open');
}
function closePoMenu(){ $('#poMenu').classList.remove('open'); }
$('#poInp').addEventListener('focus', ()=>openPoMenu(false));
$('#poInp').addEventListener('input', ()=>openPoMenu(false));
$('#poTog').addEventListener('mousedown', e=>e.preventDefault());
$('#poTog').addEventListener('click', ()=>{
  if($('#poMenu').classList.contains('open')) closePoMenu(); else openPoMenu(true);
});
$('#poMenu').addEventListener('mousedown', e=>e.preventDefault());
$('#poMenu').addEventListener('click', e=>{
  const li = e.target.closest('li[data-po]'); if(!li) return;
  $('#poInp').value = li.dataset.po; closePoMenu(); $('#poInp').blur();
});
$('#editForm').addEventListener('click', e=>{ if(!e.target.closest('.combo')) closePoMenu(); });
$('#poInp').addEventListener('blur', ()=>setTimeout(closePoMenu,150));

/* ---------- roll ---------- */
let lastRoll = null, rollPick = null, spinning = false;
function filterDesc(){
  const parts = [];
  const q = $('#q').value.trim(); if(q) parts.push(`搜「${q}」`);
  if(todoOnly) parts.push('没填完的');
  DIMS.forEach(d=>{ const f=filt[d.k];
    if(f==='all') return;
    if(f==='none') parts.push(d.label+'未填');
    else if(GROUP_DESC[f]) parts.push(GROUP_DESC[f]);
    else if(d.opts) parts.push(optLabel(d,f));
    else parts.push(f==='yes' ? d.yes : d.no);
  });
  return parts.join('、');
}
function roll(){
  if(spinning) return;
  const pool = store.items.filter(match);
  if(!pool.length){ toast(store.items.length ? '当前筛选下没有键盘，放宽一点再 roll' : '还没有记录'); return; }
  const cands = pool.length>1 ? pool.filter(x=>x.id!==lastRoll) : pool;
  rollPick = cands[Math.floor(Math.random()*cands.length)];
  lastRoll = rollPick.id;
  const desc = filterDesc();
  $('#rollMeta').textContent = `从 ${pool.length} 款里抽${desc ? '（' + desc + '）' : '（全部）'}`;
  if(!$('#rollDlg').open) $('#rollDlg').showModal();
  const box = $('#rollCard');
  if(pool.length===1){ box.className='land'; box.innerHTML=cardHTML(rollPick); return; }
  spinning = true; box.className='spin';
  let n = 0; const total = 12;
  (function tick(){
    if(n < total){
      box.innerHTML = cardHTML(pool[Math.floor(Math.random()*pool.length)]);
      n++; setTimeout(tick, 40 + n*n*1.5);
    }else{
      box.className=''; box.innerHTML = cardHTML(rollPick);
      void box.offsetWidth; box.className='land'; spinning = false;
    }
  })();
}
$('#rollBtn').onclick = roll;
$('#rollAgain').onclick = roll;
$('#rollClose').onclick = ()=>$('#rollDlg').close();
$('#rollEdit').onclick = ()=>{ if(spinning) return; $('#rollDlg').close(); openEdit(rollPick.id); };

/* ---------- data menu ---------- */
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const stamp = ()=> new Date().toISOString().slice(0,10);
$('#mBtn').onclick = ()=>$('#menuDlg').showModal();
$('#closeMenu').onclick = ()=>$('#menuDlg').close();
$('#exJson').onclick = ()=>{
  download(`键盘归档备份-${stamp()}.json`, JSON.stringify({exportedAt:Date.now(),items:store.items},null,1), 'application/json');
};
$('#exHtml').onclick = ()=>{
  const now = Date.now();
  const json = JSON.stringify({exportedAt:now, items:store.items}).replace(/</g,'\\u003c');
  const html = TEMPLATE.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/, (_,a,b)=>a+json+b);
  store.seenSeed = now; save();
  download('index.html', html, 'text/html');
  toast('已导出 index.html');
};
$('#imJson').onclick = ()=>$('#fileIn').click();
$('#fileIn').onchange = async e=>{
  const file = e.target.files[0]; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    const items = Array.isArray(data) ? data : data.items;
    if(!Array.isArray(items)) throw 0;
    const r = mergeItems(items);
    toast(`新增 ${r.added}，更新 ${r.updated}`); $('#menuDlg').close();
  }catch(err){ toast('文件读不出来，确认是这个工具导出的备份'); }
  e.target.value='';
};
</script>
